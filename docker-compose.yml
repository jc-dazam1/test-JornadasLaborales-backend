version: '3.8'

services:
  employeeapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employeeapi
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/employees.db
    volumes:
      - employeeapi_data:/app/data
    networks:
      - employeeapi_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/employees || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  employeeapi_data:
    driver: local

networks:
  employeeapi_network:
    driver: bridge
